[package]
name = "assetflow"
version = "0.1.0"
edition = "2021"
description = "Post-issuance servicing for tokenized assets on Solana: eligibility, payouts, redemptions"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "assetflow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Referenced inside Anchor's derive macros; declared so rustc stops warning.
anchor-debug = []
custom-heap = []
custom-panic = []
# Also accept MagicBlock's local development validator for private holdings:
# its key is public, so only a build for local tests may.
local-rollup = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
# The account-resolution list Token ACL reads to find the extra accounts our
# gate needs (asset, registry, investor profile) for a thaw or freeze.
spl-tlv-account-resolution = "0.11"
spl-discriminator = "0.5"
# MagicBlock: delegating private holdings to the private rollup, their read
# permissions, and committing exit tickets back to Solana.
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "access-control", "instruction"] }

[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# Payout and redemption arithmetic must never wrap silently, so overflow checks
# stay on in the deployed artifact.
overflow-checks = true
# Optimise for size: the build is 26% smaller than at opt-level 3 (1.04 MB against 1.42 MB),
# which is that much less rent to deploy and to upgrade.
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false

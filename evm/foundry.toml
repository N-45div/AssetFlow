[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@eas/=node_modules/@ethereum-attestation-service/eas-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
